display:
  background:
    path: ./resources/themes/backgrounds/{resolution}/theme_1.png
    type: image
  date:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 18
    position: &id001
      x: 0
      y: 0
    text: ''
  foreground:
    alpha: 1.0
    enabled: true
    path: ./resources/themes/foregrounds/{resolution}/theme_1.png
    position:
      x: 0
      y: 0
  metrics:
    configs:
    - bold: true
      color: '#000000ff'
      enabled: true
      font_family: 微软雅黑
      font_size: 20
      format_string: '{value}{unit}'
      italic: false
      name: cpu_temperature
      position:
        x: 32
        y: 247
      precision: 0
      unit: °C
    - bold: true
      color: '#000000ff'
      enabled: true
      font_family: 微软雅黑
      font_size: 20
      format_string: '{value}{unit}'
      italic: false
      name: gpu_temperature
      position:
        x: 162
        y: 247
      precision: 0
      unit: °C
    enabled: true
  rotation: 0
  texts:
  - bold: true
    color: '#000000ff'
    enabled: true
    font_family: 微软雅黑
    font_size: 16
    italic: false
    position:
      x: 39
      y: 224
    text: CPU
  - bold: true
    color: '#000000ff'
    enabled: true
    font_family: 微软雅黑
    font_size: 16
    italic: false
    position:
      x: 168
      y: 224
    text: GPU
  time:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 18
    position: *id001
    text: ''
