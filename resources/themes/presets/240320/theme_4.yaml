display:
  background:
    path: ./resources/themes/backgrounds/{resolution}/theme_4.png
    type: image
  date:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 18
    position: &id001
      x: 0
      y: 0
    text: ''
  foreground:
    alpha: 1.0
    enabled: true
    path: ./resources/themes/foregrounds/{resolution}/theme_4.png
    position:
      x: 0
      y: 0
  metrics:
    configs:
    - bold: true
      color: '#000000ff'
      enabled: true
      font_family: 微软雅黑
      font_size: 24
      format_string: '{value}{unit}'
      italic: false
      name: cpu_usage
      position:
        x: 30
        y: 246
      precision: 0
      unit: '%'
    - bold: true
      color: '#000000ff'
      enabled: true
      font_family: 微软雅黑
      font_size: 24
      format_string: '{value}{unit}'
      italic: false
      name: gpu_usage
      position:
        x: 160
        y: 246
      precision: 0
      unit: '%'
    enabled: true
  rotation: 0
  texts:
  - bold: true
    color: '#000000ff'
    enabled: true
    font_family: 微软雅黑
    font_size: 16
    italic: false
    position:
      x: 39
      y: 224
    text: CPU
  - bold: true
    color: '#000000ff'
    enabled: true
    font_family: 微软雅黑
    font_size: 16
    italic: false
    position:
      x: 168
      y: 224
    text: GPU
  time:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 18
    position: *id001
    text: ''
