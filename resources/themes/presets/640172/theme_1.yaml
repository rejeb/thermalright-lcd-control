display:
  background:
    path: ./resources/themes/backgrounds/{resolution}/theme_1.png
    type: image
  date:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 18
    position: &id001
      x: 0
      y: 0
    text: ''
  foreground:
    alpha: 1.0
    enabled: true
    path: ./resources/themes/foregrounds/{resolution}/theme_1.png
    position:
      x: 0
      y: 0
  metrics:
    configs:
    - bold: false
      color: '#32c5ffff'
      enabled: true
      font_family: 微软雅黑
      font_size: 36
      format_string: '{value}{unit}'
      italic: false
      name: cpu_temperature
      position:
        x: 32
        y: 96
      precision: 0
      unit: °C
    - bold: false
      color: '#44d7b6ff'
      enabled: true
      font_family: 微软雅黑
      font_size: 36
      format_string: '{value}{unit}'
      italic: false
      name: gpu_temperature
      position:
        x: 532
        y: 96
      precision: 0
      unit: °C
    enabled: true
  rotation: 0
  texts:
  - bold: true
    color: '#0191ffff'
    enabled: true
    font_family: 微软雅黑
    font_size: 24
    italic: false
    position:
      x: 46
      y: 56
    text: CPU
  - bold: true
    color: '#44d7b6ff'
    enabled: true
    font_family: 微软雅黑
    font_size: 24
    italic: false
    position:
      x: 546
      y: 56
    text: GPU
  time:
    color: '#FFFFFFFF'
    enabled: false
    font_size: 18
    position: *id001
    text: ''
