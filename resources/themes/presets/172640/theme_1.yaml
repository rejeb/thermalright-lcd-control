      unit: °C
    - bold: true
      color: '#44d7b6ff'
      enabled: true
      font_family: 微软雅黑
      font_size: 48
      format_string: '{value}{unit}'
      italic: false
      name: gpu_temperature
      position:
        x: 34
        y: 580
      precision: 0
      unit: °C
