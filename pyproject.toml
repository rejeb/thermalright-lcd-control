
[build-system]
requires = ["toml","hatchling"]
build-backend = "hatchling.build"

[project]
name = "thermalright-lcd-control"
version = "2.1.1"
description = "Thermalright LCD Control"
authors = [{ name = "REJEB BEN REJEB", email = "benrejebrejeb@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "~=3.14.6"
dependencies = [
    "PySide6-Essentials>=6.10.0",
    "hid>=1.0.8",
    "psutil>=7.1.3",
    # <5: OpenCV 5.0 is a major release with API changes; opt in deliberately,
    # not as a side effect of upgrading something else.
    "opencv-python>=4.12.0.88,<5",
    "pyvips>=2.2.3",
    "pyvips-binary>=8.16",
    "pyusb>=1.3.1",
    "numpy>=2.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.0.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
thermalright-lcd-control-app = "thermalright_lcd_control.main_app:main"

# Configuration Hatchling
[tool.hatch.build.targets.wheel]
packages = ["src/thermalright_lcd_control"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, B = bugbear, I = isort, UP = pyupgrade
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]  # line length handled case by case

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# Progressive start: do not enforce --strict on the legacy code yet.
check_untyped_defs = false
